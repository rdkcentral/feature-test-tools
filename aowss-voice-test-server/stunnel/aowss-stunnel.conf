; stunnel TLS terminator for AOWSS -> local AOWS websocket server
; Client connects with: wss://<host>:9443/
; Forwarded to: ws://127.0.0.1:9880/

foreground = no
setuid = stunnel4
setgid = stunnel4
pid = /var/run/stunnel4/aowss.pid
output = /var/log/stunnel4/aowss.log

[aowss]
client = no
accept = 9443
connect = 127.0.0.1:9880
cert = /etc/stunnel/certs/aowss.pem
; Optional hardening
; sslVersion = TLSv1.2
options = NO_SSLv2
options = NO_SSLv3
options = NO_TLSv1
options = NO_TLSv1_1
